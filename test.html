<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nguyen's</title>
<meta name="apple-mobile-web-app-title" content="Nguyen's">
<link rel="icon" type="image/png" href="./icon.png">
<link rel="apple-touch-icon" href="./icon.png">
<style>
:root{--bg:#faf6f2;--card:#fff;--tx:#2a2220;--mut:#8a7a74;--bd:#e8dcd4;--ac:#b5374f;--cash:#1f8a4c;--tip:#d9731a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111;--card:#1d1d1d;--tx:#f2ece8;--mut:#a09690;--bd:#333;--ac:#e0607a;--cash:#4cc27e;--tip:#f0933e;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#111;--card:#1d1d1d;--tx:#f2ece8;--mut:#a09690;--bd:#333;--ac:#e0607a;--cash:#4cc27e;--tip:#f0933e;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,system-ui,Segoe UI,Roboto,sans-serif;padding:12px 14px 80px;max-width:560px;margin:0 auto}
h1{font-size:20px;margin:6px 0 10px}h2{font-size:14px;letter-spacing:.06em;margin:18px 0 8px;color:var(--mut)}
.tabs{display:flex;gap:8px;margin-bottom:10px}.tabs button{flex:1;padding:10px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-weight:600}
.tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
input[type=text],input[type=number],input[type=date]{width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:16px}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}
label.chk{display:flex;gap:8px;align-items:center;margin:10px 0;font-weight:600}
.grp{display:flex;gap:6px;flex-wrap:wrap}.grp button{padding:9px 12px;border-radius:999px;border:1px solid var(--bd);background:var(--card);color:var(--tx)}
.grp button.on{background:var(--tx);color:var(--bg)}
.svc{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:10px 12px;margin:8px 0}
.svc .t{display:flex;justify-content:space-between;font-weight:700;margin-bottom:8px}
.pay{display:flex;gap:6px}.pay button{flex:1;padding:9px 0;border-radius:999px;border:1.5px solid var(--bd);background:transparent;color:var(--tx);font-weight:600;font-size:13px}
.pay .c{border-color:var(--cash);color:var(--cash)}
.bill{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:10px 12px}
.li{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--bd);gap:8px}
.li small{color:var(--mut);display:block}.li button{border:0;background:none;color:var(--ac);font-size:20px}
.tot{display:flex;justify-content:space-between;font-weight:700;font-size:18px;padding-top:10px}
.big{width:100%;padding:14px;border-radius:14px;border:0;background:var(--ac);color:#fff;font-size:16px;font-weight:700;margin-top:12px}
.sec{background:transparent;border:1px solid var(--bd);color:var(--tx)}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px}th,td{padding:7px 6px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}th{color:var(--mut);font-size:12px}
.sum{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:6px 12px}.sum div{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--bd)}.sum div:last-child{border:0}
.mut{color:var(--mut);font-size:13px}
</style></head><body>
<h1>NGUYEN'S LASHES</h1>
<div class="tabs"><button id="t1" class="on">Bill</button><button id="t2">Daily report</button></div>
<div id="v1"></div><div id="v2" hidden></div>
<script>
const NEW={c:['Natural / Classic / Hybrid New Set',80,70],v:['Volume / Wispy / Wet Set New Set',90,80],m:['Mega Volume / Anime New Set',100,90]};
const FILL={c:[['Fill 1–7 Days',40,35],['Fill 8–14 Days',50,45],['Fill 15–21 Days',60,55],['Fill 22–28 Days',70,65]],
m:[['Mega Fill 1–7 Days',45,40],['Mega Fill 8–14 Days',55,50],['Mega Fill 15–21 Days',65,60],['Mega Fill 22–28 Days',75,70]]};
const EXTRA=[['Foreign Fill',65,65],['Lash Removal',20,20],['Eyebrow Wax',10,10],['Lip / Chin Wax',5,5]];
const GN={c:'CLASSIC',v:'VOLUME / WISPY',m:'MEGA VOLUME / ANIME'};
let grp='c',promo=false,name='',tip='',items=[],day=[],share=60,date=new Date().toISOString().slice(0,10);
try{const s=JSON.parse(localStorage.getItem('lashbook')||'null');if(s){day=s.day||[];share=s.share??60;if(s.date===date)day=s.day||[];else day=[]}}catch(e){}
const nm=c=>/^(Customer|Client) \d+$/.test(c.name||'')?'':(c.name||'');
const save=()=>{try{localStorage.setItem('lashbook',JSON.stringify({day,share,date}))}catch(e){}};
const $=s=>document.querySelector(s),m=n=>'$'+(+n).toFixed(2).replace(/\.00$/,'');
// New-client promotion is based on the regular Card/Zelle price ($80/$90/$100),
// regardless of payment method. Cash prices ($70/$80/$90) apply only without promo.
const hasNewPromo=it=>!!(it.isNew&&it.promo);
const price=it=>Math.round((hasNewPromo(it)?it.card*0.8:(it.method==='cash'?it.cash:it.card))*100)/100;
const gross=it=>hasNewPromo(it)?it.card:it.cash; // original price used in the cash summary
const splitBase=it=>hasNewPromo(it)?it.card:it.cash; // Nguyên's 60% is protected from the promo discount
const showPrice=it=>hasNewPromo(it)?m(price(it))+' ('+m(it.card)+')':m(price(it));
function sumAll(){const r=calc();return `<h2>COMBINED SUMMARY (CASH)</h2><div class="sum"><div><b>REGULAR TOTAL</b><b>${m(r.tot)}</b></div><div><b>ACTUALLY COLLECTED</b><b>${m(r.inn)}</b></div><div><b>HẠNH</b><b>${m(r.hanh)}</b></div><div><b>NGUYÊN</b><b>${m(r.ng)}</b></div></div>`}
function done(){if(!day.length)return '<div class="mut">No clients saved yet.</div>';const rows=[];
 day.forEach((c,i)=>{c.items.forEach((it,j)=>{const a=showPrice(it),last=j===c.items.length-1;rows.push(`<tr><td>${j?'':i+1}</td><td>${nm(c)?nm(c)+' – ':''}${it.l}${j?'':` <small class="mut">${c.time||''}</small>`}</td><td>${it.method==='cash'?a:'—'}</td><td>${it.method==='card'?a:'—'}</td><td>${it.method==='zelle'?a:'—'}</td><td>${last&&c.tip?m(c.tip):'—'}</td><td>${j?'':`<button data-x="${i}" style="border:0;background:none;color:var(--ac);font-size:18px">×</button>`}</td></tr>`)})});
 return `<div class="tw"><table><tr><th>#</th><th>CLIENT / SERVICE</th><th>CASH</th><th>CARD</th><th>ZELLE</th><th>TIP</th><th></th></tr>${rows.join('')}</table></div>`}
function add(l,card,cash,method,isNew){items.push({l,card,cash,method,isNew,promo:isNew&&promo});render1()}
function render1(){
 const fills=FILL[grp==='m'?'m':'c'];
 const svc=(arr,isNew)=>arr.map((s,i)=>`<div class="svc"><div class="t"><span>${s[0]}</span><span>${isNew&&promo?m(s[1]*0.8)+' (original '+m(s[1])+')':isNew?m(s[1])+' Card/Zelle · '+m(s[2])+' Cash':m(s[1])}</span></div><div class="pay">
 ${['cash','zelle','card'].map(p=>`<button class="${p==='cash'?'c':''}" data-a="${isNew?'n':'x'}" data-i="${i}" data-p="${p}">${p.toUpperCase()}</button>`).join('')}</div></div>`).join('');
 const pr=it=>price(it);
 const sub=items.reduce((a,b)=>a+pr(b),0);
 $('#v1').innerHTML=`<input type="text" id="nm" placeholder="Client name" value="${name.replace(/"/g,'&quot;')}">
 <label class="chk"><input type="checkbox" id="pm" ${promo?'checked':''}> New client – 20% off New Set (discount from Card/Zelle regular price)</label>
 <h2>SERVICE GROUP</h2><div class="grp">${Object.keys(GN).map(k=>`<button data-g="${k}" class="${grp===k?'on':''}">${GN[k]}</button>`).join('')}</div>
 <h2>NEW SET</h2>${svc([NEW[grp]],true)}
 <h2>FILL</h2>${svc(fills,false).replace(/data-a="x" data-i="(\d)"/g,'data-a="f" data-i="$1"')}
 <h2>OTHER SERVICES</h2>${svc(EXTRA,false).replace(/data-a="x"/g,'data-a="e"')}
 <h2>CLIENT BILL · ${items.length} SERVICES</h2><div class="bill">
 ${items.length?items.map((it,i)=>`<div class="li"><div>${it.l}<small>${it.method.toUpperCase()}${it.isNew&&it.promo?' · 20% off':''}</small></div><div>${showPrice(it)} <button data-d="${i}">×</button></div></div>`).join(''):'<div class="mut">No services in this bill yet.</div>'}
 <div class="row" style="margin-top:10px"><span class="mut">TIP</span><input type="number" inputmode="decimal" id="tp" placeholder="0" value="${tip}"></div>
 <div class="tot"><span>BILL TOTAL</span><span>${m(sub+(+tip||0))}</span></div></div>
 <p class="mut">Every service you add goes on this one bill (several orders can share it) until you tap Next client.</p>
 <button class="big" id="sv">Next client (save bill &amp; start new)</button>
 <button class="big sec" id="nw">Clear this bill</button>
 <h2>TODAY’S CLIENTS · ${day.length}</h2>${done()}${day.length?sumAll():''}`;
 $('#nm').oninput=e=>name=e.target.value;$('#tp').oninput=e=>{tip=e.target.value;render1Tot()};
 $('#pm').onchange=e=>{promo=e.target.checked;items.forEach(i=>{if(i.isNew)i.promo=promo});render1()};
 $('#nw').onclick=()=>{items=[];name='';tip='';render1()};$('#sv').onclick=()=>{if(commit()){render1();render2();flash('Saved – new client')}};
}
function render1Tot(){const sub=items.reduce((a,b)=>a+price(b),0);$('.tot span:last-child').textContent=m(sub+(+tip||0))}
function flash(t){const d=document.createElement('div');d.textContent=t;d.style.cssText='position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:99px;font-weight:600';document.body.appendChild(d);setTimeout(()=>d.remove(),1200)}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
 if(b.dataset.g){grp=b.dataset.g;render1()}
 else if(b.dataset.a){const i=+b.dataset.i,a=b.dataset.a,p=b.dataset.p;
  if(a==='n'){const s=NEW[grp];add(s[0],s[1],s[2],p,true)}
  else if(a==='f'){const s=FILL[grp==='m'?'m':'c'][i];add(s[0],s[1],s[2],p,false)}
  else{const s=EXTRA[i];add(s[0],s[1],s[2],p,false)}}
 else if(b.dataset.d){items.splice(+b.dataset.d,1);render1()}
 else if(b.dataset.x){day.splice(+b.dataset.x,1);save();render1();render2()}});
function calc(){let tot=0,inn=0,tips=0,card=0,zelle=0,disc=0,ngServices=0;
 day.forEach(c=>{tips+=(+c.tip||0);c.items.forEach(it=>{const a=price(it);if(it.method==='cash'){const base=gross(it);tot+=base;inn+=a;disc+=base-a;ngServices+=Math.round(splitBase(it)*share)/100}else if(it.method==='card')card+=a;else zelle+=a})});
 // The new-client discount comes entirely from Hạnh's share. Nguyên keeps
 // the selected percentage of the original service price; tips belong 100% to Nguyên.
 const ng=ngServices+tips;return{tot,inn,tips,card,zelle,disc,ng,hanh:inn-ngServices}}
async function sendSum(){const t=report();try{if(navigator.share){await navigator.share({title:"Nguyen's Lashes",text:t});return}}catch(e){if(e&&e.name==='AbortError')return}try{await navigator.clipboard.writeText(t);flash('Copied – paste into a message to send')}catch(e){prompt('Copy:',t)}}
function reportImg(){const r=calc();const rows=[];day.forEach((c,i)=>c.items.forEach((it,j)=>{const a=showPrice(it),last=j===c.items.length-1;rows.push([j?'':String(i+1),(nm(c)?nm(c)+' – ':'')+it.l,it.method==='cash'?a:'—',it.method==='card'?a:'—',it.method==='zelle'?a:'—',last&&c.tip?m(c.tip):'—'])}));
 const W=1000,rh=64,n=rows.length,H=330+rh*n+110+90+4*rh+60,cv=document.createElement('canvas');cv.width=W;cv.height=H;const x=cv.getContext('2d');
 x.fillStyle='#1c1c1c';x.fillRect(0,0,W,H);x.fillStyle='#fff';x.strokeStyle='#444';x.lineWidth=2;
 const d=new Date(date+'T00:00:00').toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'});
 const F=s=>x.font=s+'px -apple-system,Helvetica,Arial,sans-serif';
 F('bold 48');x.fillText("NGUYEN'S LASHES",50,90);F('bold 34');x.fillText('DAILY SERVICE & PAYMENT REPORT',50,160);
 F('bold 32');x.fillText('Date:',50,245);const w=x.measureText('Date:').width;F('32');x.fillText(' '+d,50+w,245);
 const cx=[50,120,560,690,810,920];let y=330;F('bold 28');['#','CLIENT / SERVICE','CASH','CARD','ZELLE','TIP'].forEach((t,k)=>x.fillText(t,cx[k],y));
 const ln=yy=>{x.beginPath();x.moveTo(50,yy);x.lineTo(W-50,yy);x.stroke()};ln(y+24);F('30');
 rows.forEach(rw=>{y+=rh;rw.forEach((t,k)=>x.fillText(k===1&&t.length>26?t.slice(0,25)+'…':t,cx[k],y));ln(y+24)});
 y+=110;F('bold 44');x.fillText('CASH SUMMARY',50,y);y+=90;F('bold 30');x.fillText('Amount',560,y);ln(y+24);
 [['REGULAR TOTAL',r.tot],['ACTUALLY COLLECTED',r.inn],['HẠNH',r.hanh],['NGUYÊN',r.ng]].forEach(a=>{y+=rh;F('bold 32');x.fillText(a[0],50,y);F('32');x.fillText(m(a[1]),560,y);ln(y+24)});
 return cv}
async function sendImg(){const cv=reportImg();const b=await new Promise(r=>cv.toBlob(r,'image/png'));const f=new File([b],'lash-report.png',{type:'image/png'});
 try{if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f]});return}}catch(e){if(e&&e.name==='AbortError')return}
 try{await navigator.clipboard.write([new ClipboardItem({'image/png':b})]);flash('Picture copied – paste into a message')}catch(e){flash('Picture not supported here – use Copy report')}}
function report(){const r=calc();const d=new Date(date+'T00:00:00').toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'});
 const L=["NGUYEN'S LASHES",'DAILY SERVICE & PAYMENT REPORT','','Date: '+d,''];
 day.forEach((c,i)=>{c.items.forEach((it,j)=>{const a=showPrice(it),last=j===c.items.length-1;
  L.push((j?'':(i+1)+'. ')+(nm(c)?nm(c)+' – ':'')+it.l+(j||!c.time?'':' ['+c.time+']')+' | CASH '+(it.method==='cash'?a:'—')+' | CARD '+(it.method==='card'?a:'—')+' | ZELLE '+(it.method==='zelle'?a:'—')+' | TIP '+(last&&c.tip?m(c.tip):'—'))})});
 L.push('','CASH SUMMARY','REGULAR TOTAL: '+m(r.tot),'ACTUALLY COLLECTED: '+m(r.inn),'HẠNH: '+m(r.hanh),'NGUYÊN: '+m(r.ng));return L.join('\n')}
function render2(){const r=calc();const rows=[];
 day.forEach((c,i)=>{c.items.forEach((it,j)=>{const a=showPrice(it),last=j===c.items.length-1;rows.push(`<tr><td>${j?'':i+1}</td><td>${nm(c)?nm(c)+' – ':''}${it.l}${j?'':` <small class="mut">${c.time||''}</small>`}</td><td>${it.method==='cash'?a:'—'}</td><td>${it.method==='card'?a:'—'}</td><td>${it.method==='zelle'?a:'—'}</td><td>${last&&c.tip?m(c.tip):'—'}</td><td>${j?'':`<button data-x="${i}" style="border:0;background:none;color:var(--ac);font-size:18px">×</button>`}</td></tr>`)})});
 $('#v2').innerHTML=`<div class="row"><input type="date" id="dt" value="${date}"><div class="row"><span class="mut">Nguyên %</span><input type="number" id="sh" value="${share}"></div></div>
 <h2>DAILY SERVICE &amp; PAYMENT REPORT</h2><div class="tw"><table><tr><th>#</th><th>CLIENT / SERVICE</th><th>CASH</th><th>CARD</th><th>ZELLE</th><th>TIP</th><th></th></tr>${rows.join('')||'<tr><td colspan="7" class="mut">No clients yet.</td></tr>'}</table></div>
 <h2>CASH SUMMARY</h2><div class="tw"><table><tr><th></th><th>Amount</th></tr><tr><td><b>REGULAR TOTAL</b></td><td>${m(r.tot)}</td></tr><tr><td><b>ACTUALLY COLLECTED</b></td><td>${m(r.inn)}</td></tr><tr><td><b>HẠNH</b></td><td>${m(r.hanh)}</td></tr><tr><td><b>NGUYÊN</b></td><td>${m(r.ng)}</td></tr></table></div>
 
 <button class="big" id="si">Send as picture (aligned like the report)</button><button class="big sec" id="cp">Copy report as text</button><button class="big sec" id="sd">Share report (text)</button><button class="big sec" id="cl">Clear today’s data</button>`;
 $('#dt').onchange=e=>{date=e.target.value;save()};$('#sh').onchange=e=>{share=+e.target.value||0;save();render2()};
 $('#si').onclick=sendImg;$('#sd').onclick=sendSum;$('#cp').onclick=async()=>{try{await navigator.clipboard.writeText(report());flash('Copied')}catch(e){prompt('Copy:',report())}};
 $('#cl').onclick=()=>{if(confirm('Clear all clients for today?')){day=[];save();render1();render2()}}}
function commit(){if(!items.length)return false;day.push({name:name,items:items.slice(),tip:+tip||0,time:new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})});items=[];name='';tip='';save();return true}
function tab(n){$('#v1').hidden=n!==1;$('#v2').hidden=n!==2;$('#t1').classList.toggle('on',n===1);$('#t2').classList.toggle('on',n===2);if(n===2){if(commit())render1();render2()}}
$('#t1').onclick=()=>tab(1);$('#t2').onclick=()=>tab(2);
render1();render2();
</script></body></html>
